# 构建 JVM：显式 UTF-8，避免本机 GBK 默认编码导致的中文源码/资源乱码
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Loom 尚未完全兼容配置缓存
org.gradle.configuration-cache=false

# Minecraft / Fabric
# 26.1 起官方不再混淆，Yarn 已停更，本工程直接使用官方名称，无需任何 mappings
minecraft_version=26.3-rc-2
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.160.4+26.3
# 上面这个版本 client.jar 里 version.json 的 pack_version（major.minor），
# 导出的资源包写 pack.mcmeta 要用（数据包格式号由 TargetVersion 一并提供）。跟版本时和 minecraft_version 一起改：
# 数据包格式号在 26.3-pre-3 从 120 涨到 121，漏改的表现是导出的数据包在列表里显示「不兼容」。
# docs/vanilla/<版本>/version.json 在的话，TargetVersionTest 会拿它核对这两个值。
resource_pack_format=97.1
data_pack_format=121.0

# Mod
# SemVer：正式版 0.1.0，开发版带 -alpha.N / -beta.N。
# 实际版本号由 build.gradle 拼成「mod_version+minecraft_version」，例如 0.1.0-alpha.1+26.3-rc-2，
# 跟 MC 版本时只改上面的 minecraft_version。
mod_version=0.1.0-alpha.1
maven_group=mc.GTedd.cn.gtshaders
archives_base_name=GTShaders
